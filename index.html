<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌡️ Temperature Converter</h1>
        <p class="subtitle">Convert temperatures in seconds!</p>

        <div class="input-box">
            <label for="temperature">Enter Temperature</label>
            <input type="number" id="temperature"
                   placeholder="Enter a value">

            <label for="fromUnit">Convert From</label>
            <select id="fromUnit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <label for="toUnit">Convert To</label>
            <select id="toUnit">
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="celsius">Celsius (°C)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <button id="convertBtn">Convert Temperature</button>

            <div class="result-box">
                <p>Your Result</p>
                <h2 id="result">--</h2>
                <p id="message">Your converted temperature will appear here.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
